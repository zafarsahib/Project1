{% extends "base.html" %}

{% block title %}
Add Pet - Pet Adoption
{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <h1 class="fw-bold">Add New Pet</h1>
                <p class="text-muted mb-0">
                    Add a new pet to the adoption system.
                </p>
            </div>

            <div class="card border-success shadow-sm">
                <div class="card-body p-4">
                    <form method="POST">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label fw-semibold">
                                    Pet Name
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="species" class="form-label fw-semibold">
                                    Species
                                </label>
                                <select
                                    class="form-select"
                                    id="species"
                                    name="species"
                                    required
                                >
                                    <option value="">Select species</option>
                                    <option value="Dog">Dog</option>
                                    <option value="Cat">Cat</option>
                                    <option value="Rabbit">Rabbit</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="breed" class="form-label fw-semibold">
                                    Breed
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="breed"
                                    name="breed"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="age" class="form-label fw-semibold">
                                    Age
                                </label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="age"
                                    name="age"
                                    min="0"
                                    required
                                >
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="gender" class="form-label fw-semibold">
                                Gender
                            </label>
                            <select
                                class="form-select"
                                id="gender"
                                name="gender"
                                required
                            >
                                <option value="">Select gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">
                                Description
                            </label>
                            <textarea
                                class="form-control"
                                id="description"
                                name="description"
                                rows="4"
                                placeholder="Describe the pet..."
                            ></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="image" class="form-label fw-semibold">
                                Image File Name
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="image"
                                name="image"
                                placeholder="example.jpg"
                            >
                            <div class="form-text">
                                Store the image in static/images.
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Add Pet
                            </button>

                            <a
                                href="{{ url_for('admin_dashboard') }}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
